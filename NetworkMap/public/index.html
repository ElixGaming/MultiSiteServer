<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Map</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf2;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}.top{height:64px;background:#111820;border-bottom:1px solid #29333d;display:flex;align-items:center;padding:0 18px;gap:18px}.title{font-size:20px;font-weight:700}.sub{color:#84909b;font-size:13px}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #35424d;background:#18212a;color:#e9eef2;padding:9px 12px;border-radius:7px;cursor:pointer}.btn:hover{background:#222e39}.btn.primary{background:#1769aa;border-color:#2386d1}.layout{height:calc(100vh - 64px);display:grid;grid-template-columns:1fr 330px}.mapwrap{position:relative;overflow:hidden;background:radial-gradient(circle at center,#111923 0,#0b0f14 65%)}svg{width:100%;height:100%;cursor:grab}.side{background:#10171e;border-left:1px solid #29333d;padding:18px;overflow:auto}.side h2{margin:0 0 14px;font-size:18px}.field{margin:10px 0}.field label{display:block;color:#8f9ba6;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0b1117;border:1px solid #303c47;color:#e8edf2;border-radius:6px;padding:9px}.field textarea{min-height:70px;resize:vertical}.empty{color:#7f8b96;line-height:1.5}.danger{border-color:#6b3030;color:#ffb4b4}.node rect{fill:#151e27;stroke:#42515e;stroke-width:2}.node:hover rect{stroke:#67b7ff}.node.selected rect{stroke:#4ca8ff;stroke-width:3}.node text{pointer-events:none}.node .name{fill:#f2f5f7;font-size:14px;font-weight:700}.node .type{fill:#8c9aa6;font-size:11px}.node .ip{fill:#68c1ff;font-size:11px}.link{stroke:#4b5965;stroke-width:3}.link.active{stroke:#58a6d8}.toolbar{position:absolute;left:15px;bottom:15px;display:flex;gap:7px}.badge{position:absolute;top:14px;left:15px;background:#111a22cc;border:1px solid #2d3a45;padding:7px 10px;border-radius:6px;color:#9ba8b4;font-size:12px}.hint{font-size:11px;color:#73808b;margin-top:12px}.count{margin-left:8px;color:#67b7ff}.check{display:flex;align-items:center;gap:7px;color:#9ba8b4;font-size:12px;margin-top:10px}.check input{width:auto}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:min(460px,92vw);background:#111820;border:1px solid #34414d;border-radius:10px;padding:20px;box-shadow:0 20px 60px #0008}.box h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
</style></head><body><header class="top"><div><div class="title">Network Map <span class="count" id="count"></span></div><div class="sub">Carte interactive du réseau local</div></div><div class="actions"><button class="btn primary" id="add">＋ Ajouter un équipement</button><button class="btn" id="save">💾 Sauvegarder</button><button class="btn" id="reset">↺ Réinitialiser</button></div></header><main class="layout"><section class="mapwrap"><div class="badge">Équipements personnalisables · données locales</div><svg id="svg" viewBox="0 0 1300 700"><g id="world"></g></svg><div class="toolbar"><button class="btn" id="zin">＋</button><button class="btn" id="zout">−</button><button class="btn" id="zreset">⟳</button></div></section><aside class="side" id="side"><h2>Équipement</h2><div class="empty">Clique sur un équipement pour afficher ses informations.<br><br>Tu peux ajouter toi-même un appareil avec son nom, type, IP, adresse MAC et description.</div></aside></main><div class="modal" id="modal"><div class="box"><h2>Ajouter un équipement</h2><div class="field"><label>Nom *</label><input id="f_name" placeholder="Ex. PC portable"></div><div class="field"><label>Type</label><input id="f_type" placeholder="Ex. Wi-Fi, Ethernet, NAS..."></div><div class="field"><label>Adresse IP</label><input id="f_ip" placeholder="192.168.1.200"></div><div class="field"><label>Adresse MAC</label><input id="f_mac" placeholder="AA:BB:CC:DD:EE:FF"></div><div class="field"><label>Description</label><textarea id="f_desc" placeholder="Informations supplémentaires..."></textarea></div><div class="field"><label>Connecté à</label><select id="f_parent"><option value="">Aucune connexion</option></select></div><div class="modal-actions"><button class="btn" id="cancel">Annuler</button><button class="btn primary" id="create">Ajouter</button></div></div></div><script>
const svg=document.getElementById('svg'),world=document.getElementById('world'),side=document.getElementById('side');let data,selected=null,scale=1,ox=0,oy=0,drag=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(method='GET'){const r=await fetch('/api/network',{method,headers:{'Content-Type':'application/json'},body:method==='POST'?JSON.stringify(data):undefined});return r.json()}
function render(){world.innerHTML='';$('count').textContent=`${data.nodes.length} équipement${data.nodes.length>1?'s':''}`;const by=new Map(data.nodes.map(n=>[n.id,n]));
 data.links.forEach(([a,b])=>{const A=by.get(a),B=by.get(b);if(!A||!B)return;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.classList.add('link');l.setAttribute('x1',A.x+90);l.setAttribute('y1',A.y+35);l.setAttribute('x2',B.x+90);l.setAttribute('y2',B.y+35);world.appendChild(l)});
 data.nodes.forEach(n=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('node');if(n.id===selected)g.classList.add('selected');g.dataset.id=n.id;g.setAttribute('transform',`translate(${n.x},${n.y})`);g.innerHTML=`<rect width="180" height="70" rx="8"></rect><text class="name" x="12" y="21">${esc(n.name)}</text><text class="type" x="12" y="39">${esc(n.type||'Équipement')}</text><text class="ip" x="12" y="57">${esc(n.ip||'IP non renseignée')}</text>`;g.addEventListener('click',e=>{e.stopPropagation();select(n.id)});g.addEventListener('pointerdown',e=>{e.stopPropagation();drag={id:n.id,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y};g.setPointerCapture(e.pointerId)});g.addEventListener('pointermove',e=>{if(!drag||drag.id!==n.id)return;n.x=drag.x+(e.clientX-drag.sx)/scale;n.y=drag.y+(e.clientY-drag.sy)/scale;g.setAttribute('transform',`translate(${n.x},${n.y})`);renderLinksOnly()});g.addEventListener('pointerup',()=>{if(drag){drag=null;save()}});world.appendChild(g)});world.setAttribute('transform',`translate(${ox},${oy}) scale(${scale})`)}
function renderLinksOnly(){const by=new Map(data.nodes.map(n=>[n.id,n]));world.querySelectorAll('.link').forEach((l,i)=>{const [a,b]=data.links[i]||[];const A=by.get(a),B=by.get(b);if(A&&B){l.setAttribute('x1',A.x+90);l.setAttribute('y1',A.y+35);l.setAttribute('x2',B.x+90);l.setAttribute('y2',B.y+35)}})}
function select(id){selected=id;const n=data.nodes.find(x=>x.id===id);render();side.innerHTML=`<h2>${esc(n.name)}</h2><div class="field"><label>Nom</label><input id="e_name" value="${esc(n.name)}"></div><div class="field"><label>Type</label><input id="e_type" value="${esc(n.type)}"></div><div class="field"><label>Adresse IP</label><input id="e_ip" value="${esc(n.ip)}"></div><div class="field"><label>Adresse MAC</label><input id="e_mac" value="${esc(n.mac)}"></div><div class="field"><label>Description</label><textarea id="e_desc">${esc(n.description)}</textarea></div><button class="btn primary" id="update">Enregistrer les modifications</button> <button class="btn danger" id="del">Supprimer</button><div class="hint">La position sur la carte est aussi sauvegardée automatiquement.</div>`;$('update').onclick=()=>{n.name=$('e_name').value.trim()||'Équipement';n.type=$('e_type').value.trim();n.ip=$('e_ip').value.trim();n.mac=$('e_mac').value.trim();n.description=$('e_desc').value.trim();save().then(render)};$('del').onclick=()=>{if(!confirm('Supprimer cet équipement ?'))return;data.nodes=data.nodes.filter(x=>x.id!==id);data.links=data.links.filter(x=>x[0]!==id&&x[1]!==id);selected=null;save().then(render);side.innerHTML='<h2>Équipement</h2><div class="empty">Équipement supprimé.</div>'}};
$('add').onclick=()=>{$('f_name').value='';$('f_type').value='';$('f_ip').value='';$('f_mac').value='';$('f_desc').value='';$('f_parent').innerHTML='<option value="">Aucune connexion</option>'+data.nodes.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('');$('modal').classList.add('show');$('f_name').focus()};$('cancel').onclick=()=>$('modal').classList.remove('show');$('create').onclick=()=>{const name=$('f_name').value.trim();if(!name)return alert('Le nom est obligatoire.');const n={id:'n_'+Date.now(),name,type:$('f_type').value.trim()||'Équipement',ip:$('f_ip').value.trim(),mac:$('f_mac').value.trim(),description:$('f_desc').value.trim(),x:450+Math.random()*250,y:380+Math.random()*180};data.nodes.push(n);const p=$('f_parent').value;if(p)data.links.push([p,n.id]);$('modal').classList.remove('show');selected=n.id;save().then(render).then(()=>select(n.id))};$('save').onclick=()=>save().then(()=>alert('Carte sauvegardée localement.'));
$('reset').onclick=async()=>{if(!confirm('Réinitialiser toute la carte avec les équipements de base ?'))return;data=await fetch('/api/network?reset=1').then(r=>r.json()).catch(()=>data);location.reload()};
$('zin').onclick=()=>{scale=Math.min(2.5,scale*1.15);world.setAttribute('transform',`translate(${ox},${oy}) scale(${scale})`)};$('zout').onclick=()=>{scale=Math.max(.45,scale/1.15);world.setAttribute('transform',`translate(${ox},${oy}) scale(${scale})`)};$('zreset').onclick=()=>{scale=1;ox=0;oy=0;world.setAttribute('transform','translate(0,0) scale(1)')};
svg.addEventListener('pointerdown',e=>{if(e.target!==svg)return;drag={pan:true,sx:e.clientX,sy:e.clientY,ox,oy}});svg.addEventListener('pointermove',e=>{if(!drag?.pan)return;ox=drag.ox+e.clientX-drag.sx;oy=drag.oy+e.clientY-drag.sy;world.setAttribute('transform',`translate(${ox},${oy}) scale(${scale})`)});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(2.5,scale*(e.deltaY<0?1.08:.92)));world.setAttribute('transform',`translate(${ox},${oy}) scale(${scale})`)},{passive:false});
(async()=>{data=await api();render()})();
</script></body></html>
